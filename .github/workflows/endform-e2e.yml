name: Endform E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: endform-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait landing preview and set base URL
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: trvt-landing
          set-url-env-var: PLAYWRIGHT_BASE_URL

      - name: Wait app preview
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: trvt-app

      - name: Wait admin preview
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: trvt-admin

      - name: Run app E2E with Endform
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: bunx endform@latest test --config apps/app/playwright.config.ts

      - name: Run admin E2E with Endform
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: bunx endform@latest test --config apps/admin/playwright.config.ts
